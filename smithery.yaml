startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      alpha402TxHash:
        type: string
        description: "Optional prepaid Base USDC transaction hash (0x...) for unlimited bot queries. Leave blank for instant free tier."
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/mcp/server.js'],
      env: config && config.alpha402TxHash ? { ALPHA402_TX_HASH: config.alpha402TxHash } : {}
    })
